<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve Jobs Shadowing App</title>
    <style>
        :root {
            --bg-color: #0b0f12;
            --card-bg: #161b22;
            --card-border: #21262d;
            --card-active-bg: #0d2818;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --text-ipa: #79c0ff;
            --highlight: #00ff88;
            --highlight-glow: rgba(0, 255, 136, 0.25);
        }
        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            padding-bottom: 250px; 
            -webkit-tap-highlight-color: transparent;
        }
        
        header { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            background: rgba(11, 15, 18, 0.95); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 8px; 
            z-index: 100; 
            border-bottom: 1px solid var(--card-border); 
        }
        .flex-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
        button { 
            background: #21262d; 
            color: var(--text-main); 
            border: 1px solid #30363d; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        button.active { 
            background: #1f6feb; 
            border-color: #388bfd; 
            color: #fff;
        }
        
        .content { margin-top: 110px; max-width: 700px; margin-left: auto; margin-right: auto; }
        .chapter-title { 
            font-size: 1.1rem; 
            color: var(--highlight); 
            margin: 35px 0 12px 0; 
            padding-bottom: 6px; 
            border-bottom: 2px solid var(--card-border); 
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
            font-weight: 800;
        }
        .sentence-card { 
            padding: 16px 18px; 
            margin: 10px 0; 
            background: var(--card-bg); 
            border-radius: 12px; 
            border: 1px solid var(--card-border);
            border-left: 5px solid #30363d; 
            cursor: pointer; 
            transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease; 
        }
        
        .sentence-card.active { 
            background: var(--card-active-bg); 
            border-color: var(--highlight);
            border-left-color: var(--highlight); 
            transform: scale(1.02); 
            box-shadow: 0 4px 20px var(--highlight-glow);
        }
        .sentence-card.active .en {
            color: var(--highlight);
            text-shadow: 0 0 10px var(--highlight-glow);
        }
        
        .en { font-size: 1.45rem; line-height: 1.45; font-weight: 700; }
        .ja { font-size: 1.0rem; color: var(--text-sub); margin-top: 8px; line-height: 1.4; display: none; }
        .ipa { font-size: 0.9rem; color: var(--text-ipa); font-family: 'SF Mono', Consolas, Monaco, monospace; margin-top: 6px; display: none; }
        
        body.mode-en .ja, body.mode-en .ipa { display: none; }
        body.mode-en-ja .ja { display: block; }
        body.mode-en-ipa .ipa { display: block; }

        .controller { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(11, 15, 18, 0.95); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 10px 28px 10px; 
            border-top: 1px solid var(--card-border); 
            z-index: 100; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 8px; 
        }
        .ctrl-main { display: flex; justify-content: center; gap: 10px; width: 100%; max-width: 500px; }
        .btn-huge { 
            flex: 1; 
            font-size: 1.1rem; 
            padding: 16px 0; 
            background: #21262d; 
            border-radius: 10px; 
            color: var(--text-main); 
            font-weight: 700; 
            border: 1px solid #30363d; 
        }
        .btn-play { background: #238636; border-color: #2ea043; color: #fff; }
        .btn-play.playing { background: #da3633; border-color: #f85149; }
        
        .ctrl-sub { display: flex; justify-content: center; gap: 10px; width: 100%; max-width: 500px; }
        .btn-loop.loop-on { background: var(--highlight); color: #000; border-color: var(--highlight); font-weight: 800; }
        select { background: #21262d; color: var(--text-main); font-size: 1rem; padding: 10px; border-radius: 8px; border: 1px solid #30363d; font-weight: 700; }
    </style>
</head>
<body class="mode-en">

    <header>
        <div class="flex-row">
            <button id="tab-Intro" onclick="scrollToChapter('Intro')" class="tab-btn active">Intro</button>
            <button id="tab-Story1" onclick="scrollToChapter('Story1')" class="tab-btn">1. Dots</button>
            <button id="tab-Story2" onclick="scrollToChapter('Story2')" class="tab-btn">2. Love&Loss</button>
            <button id="tab-Story3" onclick="scrollToChapter('Story3')" class="tab-btn">3. Death</button>
        </div>
        <div class="flex-row">
            <button onclick="switchMode('en')" class="mode-btn active">英語のみ</button>
            <button onclick="switchMode('en-ja')" class="mode-btn">英語+和訳</button>
            <button onclick="switchMode('en-ipa')" class="mode-btn">英語+IPA</button>
        </div>
    </header>

    <audio id="audioPlayer" src="Jobs.m4a"></audio>

    <div class="content" id="sentenceContainer"></div>

    <div class="controller">
        <div class="ctrl-main">
            <button class="btn-huge" onclick="prevSentence()">≪ 1文戻る</button>
            <button class="btn-huge btn-play" id="playBtn" onclick="togglePlay()">▶ 再生</button>
            <button class="btn-huge" onclick="nextSentence()">1文進む ≫</button>
        </div>
        <div class="ctrl-sub">
            <button class="btn-huge btn-loop" id="loopBtn" onclick="toggleLoop()">🔁 1文ループ: OFF</button>
            <select id="speedSelect" onchange="changeSpeed()">
                <option value="0.8">0.8x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.2">1.2x</option>
                <option value="1.5">1.5x</option>
                <option value="2.0">2.0x</option>
            </select>
        </div>
    </div>

    <script>
        const SPEECH_DATA = [
            { id: 1, chapter: "Intro", start: 0.0, end: 4.5, en: "Thank you.", ja: "ありがとうございます。", ipa: "θæŋk juː." },
            { id: 2, chapter: "Intro", start: 4.5, end: 9.0, en: "I'm honored to be with you today", ja: "本日、皆さんと出席できることを光栄に思います", ipa: "aɪm ˈɑnərd tə bi wɪð ju təˈdeɪ" },
            { id: 3, chapter: "Intro", start: 9.0, end: 14.0, en: "for your commencement from one of the finest universities in the world.", ja: "世界最高峰の大学の一つであるここスタンフォードの卒業式に。", ipa: "fər jʊr kəˈmɛnsmənt frəm wʌn əv ðə ˈfaɪnəst ˌjunəˈvɜrsətiz ɪn ðə wɜrld." },
            { id: 4, chapter: "Intro", start: 14.0, end: 19.5, en: "Truth be told, I never graduated from college,", ja: "実を言えば、私自身は大学を卒業していません。", ipa: "truθ bi toʊld, aɪ ˈnɛvər ˈgræʤuˌeɪtəd frəm ˈkɑlɪʤ," },
            { id: 5, chapter: "Intro", start: 19.5, end: 26.0, en: "and this is the closest I've ever gotten to a college graduation.", ja: "アンドこれが、私がこれまでで最も大学の卒業式に近づいた瞬間です。", ipa: "ænd ðɪs ɪz ðə ˈkloʊsəst aɪv ˈɛvər ˈgɑtən tu ə ˈkɑlɪʤ ˌgræʤuˈeɪʃən." },
            { id: 6, chapter: "Intro", start: 26.0, end: 30.0, en: "Today I want to tell you three stories from my life.", ja: "今日、私は自分の人生から3つの物語をお話ししたいと思います。", ipa: "təˈdeɪ aɪ wɑnt tə tɛl ju θri ˈstɔriz frəm maɪ laɪf." },
            { id: 7, chapter: "Intro", start: 30.0, end: 35.0, en: "That's it. No big deal. Just three stories.", ja: "それだけです。大したことではありません。ただの3つの物語です。", ipa: "ðæts ɪt. noʊ bɪg dil. ʤʌst θri ˈstɔriz." },
            { id: 8, chapter: "Story1", start: 35.0, end: 39.5, en: "The first story is about connecting the dots.", ja: "最初の物語は、「点と点をつなぐ」ことについてです。", ipa: "ðə fɜrst ˈstɔri ɪz əˈbaʊt kəˈnɛktɪŋ ðə dɑts." },
            { id: 9, chapter: "Story1", start: 39.5, end: 43.5, en: "I dropped out of Reed College after the first six months,", ja: "私はリード大学を入学後最初の6ヶ月で中退しましたが、", ipa: "aɪ drɑpt aʊt əv rid ˈkɑlɪʤ ˈæftər ðə fɜrst sɪks mʌnθs," },
            { id: 10, chapter: "Story1", start: 43.5, end: 46.0, en: "but then stayed around as a drop-in", ja: "本当に辞めるまでの18ヶ月ほどは", ipa: "bʌt ðɛn steɪd əˈraʊnd æz ə drɑp-ɪn" },
            { id: 11, chapter: "Story1", start: 46.0, end: 49.0, en: "for another 18 months or so before I really quit.", ja: "モグリの学生として大学の周りをうろついていました。", ipa: "fər əˈnʌðər 18 mʌnθs ɔr soʊ bɪˈfɔr aɪ ˈrɪli kwɪt." },
            { id: 12, chapter: "Story1", start: 49.0, end: 51.5, en: "So why did I drop out?", ja: "なぜ中退したのか？", ipa: "soʊ waɪ dɪd aɪ drɑp aʊt?" },
            { id: 13, chapter: "Story1", start: 51.5, end: 55.0, en: "It started before I was born.", ja: "それは私が生まれる前に始まりました。", ipa: "ɪt ˈstɑrtəd bɪˈfɔr aɪ wʌz bɔrn." },
            { id: 14, chapter: "Story1", start: 55.0, end: 59.5, en: "My biological mother was a young, unwed graduate student,", ja: "私の生みの親は若く未婚の大学院生で、", ipa: "maɪ ˌbaɪəˈlɑʤɪkəl ˈmʌðər wʌz ə jʌŋ, ənˈwɛd ˈgræʤuət ˈstudənt," },
            { id: 15, chapter: "Story1", start: 59.5, end: 63.5, en: "and she decided to put me up for adoption.", ja: "私を養子に出すことを決めました。", ipa: "ænd ʃi dɪˈsaɪdəd tə pʊt mi ʌp fər əˈdɑpʃən." },
            { id: 16, chapter: "Story1", start: 63.5, end: 68.0, en: "She felt very strongly that I should be adopted by college graduates,", ja: "彼女は私を大学卒の親に養子縁組させるべきだと強く望んでいたため、", ipa: "ʃi fɛlt ˈvɛri ˈstrɔŋli ðæt aɪ ʃʊd bi əˈdɑptəd baɪ ˈkɑlɪʤ ˈgræʤuəts," },
            { id: 17, chapter: "Story1", start: 68.0, end: 72.0, en: "so everything was all set for me to be adopted at birth", ja: "私があらかじめ生まれたら", ipa: "soʊ ˈɛvriˌθɪŋ wʌz ɔl sɛt fər mi tə bi əˈdɑptəd æt bɜrθ" },
            { id: 18, chapter: "Story1", start: 72.0, end: 75.0, en: "by a lawyer and his wife.", ja: "弁護士夫婦に引き取られるよう全て手配されていました。", ipa: "baɪ ə ˈlɔjər ænd hɪz waɪf." },
            { id: 19, chapter: "Story1", start: 75.0, end: 78.0, en: "Except that when I popped out,", ja: "ただし、私が生まれた瞬間に、", ipa: "ɪkˈsɛpt ðæt wɛn aɪ pɑpt aʊt," },
            { id: 20, chapter: "Story1", start: 78.0, end: 82.5, en: "they decided at the last minute that they really wanted a girl.", ja: "彼らが「やっぱり女の子が欲しい」と土壇場で心変わりしたことを除いては。", ipa: "ðeɪ dɪˈsaɪdəd æt ðə læst ˈmɪnət ðæt ðeɪ ˈrɪli ˈwɑntəd ə gɜrl." },
            { id: 21, chapter: "Story1", start: 82.5, end: 86.5, en: "So my parents, who were on a waiting list,", ja: "そのため、待機リストにいた現在の両親の元に", ipa: "soʊ maɪ ˈpɛrənts, hu wɜr ɑn ə ˈweɪtɪŋ lɪst," },
            { id: 22, chapter: "Story1", start: 86.5, end: 90.0, en: "got a call in the middle of the night asking:", ja: "夜中に電話がかかってきました。", ipa: "gɑt ə kɔl ɪn ðə ˈmɪdəl əv ðə naɪt ˈæskɪŋ:" },
            { id: 23, chapter: "Story1", start: 90.0, end: 94.0, en: ' "We\'ve got an unexpected baby boy; do you want him?" ', ja: "「思いがけず男の子が生まれたのですが、引き取りますか？」と。", ipa: "wiv gɑt ən ˌʌnɪkˈspɛktəd ˈbeɪbi bɔɪ; dʊ ju wɑnt hɪm?" },
            { id: 24, chapter: "Story1", start: 94.0, end: 97.5, en: 'They said: "Of course."', ja: "両親は「もちろんです」と答えました。", ipa: "ðeɪ sɛd: ʌv kɔrs." },
            { id: 25, chapter: "Story1", start: 97.5, end: 101.0, en: "My biological mother found out later", ja: "生みの親は後になって知りました、", ipa: "maɪ ˌbaɪəˈlɑʤɪkəl ˈmʌðər faʊnd aʊt ˈleɪtər" },
            { id: 26, chapter: "Story1", start: 101.0, end: 105.0, en: "that my mother had never graduated from college", ja: "引き取った母親が大学を出ておらず、", ipa: "ðæt maɪ ˈmʌðər hæd ˈnɛvər ˈgræʤuˌeɪtəd frəm ˈkɑlɪʤ" },
            { id: 27, chapter: "Story1", start: 105.0, end: 108.5, en: "and that my father had never graduated from high school.", ja: "父親も高校を出ていないことを。", ipa: "ænd ðæt maɪ ˈfɑðər hæd ˈnɛvər ˈgræʤuˌeɪtəd frəm haɪ skul." },
            { id: 28, chapter: "Story1", start: 108.5, end: 112.0, en: "She refused to sign the final adoption papers.", ja: "彼女は最終的な養子縁組書類への署名を拒否しました。", ipa: "ʃi rɪˈfjuzd tə saɪn ðə ˈfaɪnəl əˈdɑpʃən ˈpeɪpərz." },
            { id: 29, chapter: "Story1", start: 112.0, end: 116.5, en: "She only relented a few months later", ja: "数ヶ月後、彼女はようやく折れました、", ipa: "ʃi ˈoʊnli rɪˈlɛntəd ə fju mʌnθs ˈleɪtər" },
            { id: 30, chapter: "Story1", start: 116.5, end: 120.0, en: "when my parents promised that I would go to college.", ja: "両親が「私を必ず大学に通わせる」と約束したことで。", ipa: "wɛn maɪ ˈpɛrənts ˈprɑməst ðæt aɪ wʊd goʊ tə ˈkɑlɪʤ." },
            { id: 31, chapter: "Story1", start: 120.0, end: 124.0, en: "This was the start in my life.", ja: "これが私の人生の始まりでした。", ipa: "ðɪs wʌz ðə stɑrt ɪn maɪ laɪf." },
            { id: 32, chapter: "Story1", start: 124.0, end: 128.5, en: "And 17 years later I did go to college,", ja: "アンド17年後、私は本当に大学に入学しました。", ipa: "ænd 17 jɪrz ˈleɪtər aɪ dɪd goʊ tə ˈkɑlɪʤ," },
            { id: 33, chapter: "Story1", start: 128.5, end: 132.5, en: "but I naively chose a college", ja: "しかし愚かにも選んでしまったのです、", ipa: "bʌt aɪ nɑˈivli ʧoʊz ə ˈkɑlɪʤ" },
            { id: 34, chapter: "Story1", start: 132.5, end: 136.0, en: "that was almost as expensive as Stanford,", ja: "スタンフォードと同じくらい学費の高い大学を。", ipa: "ðæt wʌz ˈɔlˌmoʊst æz ɪkˈspɛnsɪv æz ˈstænfərd," },
            { id: 35, chapter: "Story1", start: 136.0, end: 140.0, en: "and all of my working-class parents' savings", ja: "アンド労働者階級の両親の貯金全てが", ipa: "ænd ɔl əv maɪ ˈwɜrkɪŋ-klæs ˈpɛrənts ˈseɪvɪŋz" },
            { id: 36, chapter: "Story1", start: 140.0, end: 144.0, en: "were being spent on my college tuition.", ja: "授業料に消えていくことになりました。", ipa: "wɜr ˈbiɪŋ spɛnt ɑn maɪ ˈkɑlɪʤ tuˈɪʃən." },
            { id: 37, chapter: "Story1", start: 144.0, end: 148.0, en: "After six months, I couldn't see the value in it.", ja: "6ヶ月後、私はそこに価値を見出せなくなりました。", ipa: "ˈæftər sɪks mʌnθs, aɪ ˈkʊdənt si ðə ˈvælju ɪn ɪt." },
            { id: 38, chapter: "Story1", start: 148.0, end: 152.0, en: "I had no idea what I wanted to do with my life", ja: "人生で何をしたいのかも分からず、", ipa: "aɪ hæd noʊ aɪˈdiə wʌt aɪ ˈwɑntəd tə du wɪð maɪ laɪf" },
            { id: 39, chapter: "Story1", start: 152.0, end: 157.0, en: "and no idea how college was going to help me figure it out.", ja: "大学がそれをどう助けてくれるのかも分かりませんでした。", ipa: "ænd noʊ aɪˈdiə haʊ ˈkɑlɪʤ wʌz ˈgoʊɪŋ tə hɛlp mi ˈfɪgjər ɪt aʊt." },
            { id: 40, chapter: "Story1", start: 157.0, end: 161.0, en: "And here I was spending all the money", ja: "しかも私は使っていたのです、", ipa: "ænd hɪr aɪ wʌz ˈspɛndɪŋ ɔl ðə ˈmʌni" },
            { id: 41, chapter: "Story1", start: 161.0, end: 164.5, en: "my parents had saved their entire life.", ja: "両親が一生かけて貯めたお金を。", ipa: "maɪ ˈpɛrənts hæd seɪvd ðɛr ɪnˈtaɪər laɪf." },
            { id: 42, chapter: "Story1", start: 164.5, end: 168.0, en: "So I decided to drop out", ja: "だから中退を決め、", ipa: "soʊ aɪ dɪˈsaɪdəd tə drɑp aʊt" },
            { id: 43, chapter: "Story1", start: 168.0, end: 172.0, en: "and trust that it would all work out okay.", ja: "全てはうまくいくと信じることにしました。", ipa: "ænd trʌst ðæt ɪt wʊd ɔl wɜrk aʊt ˌoʊˈkeɪ." },
            { id: 44, chapter: "Story1", start: 172.0, end: 176.0, en: "It was pretty scary at the time,", ja: "当時は生きた心地もしませんでしたが、", ipa: "ɪt wʌz ˈprɪti ˈskɛri æt ðə taɪm," },
            { id: 45, chapter: "Story1", start: 176.0, end: 180.0, en: "but looking back it was one of the best decisions I ever made.", ja: "振り返れば人生最良の決断の一つでした。", ipa: "bʌt ˈlʊkɪŋ bæk ɪt wʌz wʌn əv ðə bɛst dɪˈsɪʒənz aɪ ˈɛvər meɪd." },
            { id: 46, chapter: "Story1", start: 180.0, end: 183.0, en: "The minute I dropped out", ja: "中退した瞬間から、", ipa: "ðə ˈmɪnət aɪ drɑpt aʊt" },
            { id: 47, chapter: "Story1", start: 183.0, end: 188.0, en: "I could stop taking the required classes that didn't interest me,", ja: "興味のない必修科目をやめることができ、", ipa: "aɪ kʊd stɑp ˈteɪkɪŋ ðə rɪˈkwaɪərd ˈklæsəz ðæt ˈdɪdənt ˈɪntrəst mi," },
            { id: 48, chapter: "Story1", start: 188.0, end: 193.0, en: "and begin dropping in on the ones that looked far more interesting.", ja: "面白そうな授業に潜り込み始めました。", ipa: "ænd bɪˈgɪn ˈdrɑpɪŋ ɪn ɑn ðə wʌnz ðæt lʊkt fɑr mɔr ˈɪntrəstɪŋ." },
            { id: 49, chapter: "Story1", start: 193.0, end: 196.0, en: "It wasn't all romantic.", ja: "ロマンチックなことばかりではありませんでした。", ipa: "ɪt ˈwɑzənt ɔl roʊˈmæntɪk." },
            { id: 50, chapter: "Story1", start: 196.0, end: 201.0, en: "I didn't have a dorm room, so I slept on the floor in friends' rooms,", ja: "寮がなく友達の部屋の床で寝て、", ipa: "aɪ ˈdɪdənt hæv ə dɔrm rum, soʊ aɪ slɛpt ɑn ðə flɔr ɪn frɛndz rumz," },
            { id: 51, chapter: "Story1", start: 201.0, end: 206.0, en: "I returned coke bottles for the 5¢ deposits to buy food with,", ja: "コーラの空き瓶を5セントのデポジットに換えて食べ物を買い、", ipa: "aɪ rɪˈtɜrnd koʊk ˈbɑtəlz fər ðə faɪv sɛnt dɪˈpɑzɪts tə baɪ fud wɪθ," },
            { id: 52, chapter: "Story1", start: 206.0, end: 211.0, en: "and I would walk the 7 miles across town every Sunday night", ja: "毎週日曜の夜は街を7マイル歩いて渡り、", ipa: "ænd aɪ wʊd wɔk ðə ˈsɛvən maɪlz əˈkrɔs taʊn ˈɛvri ˈsʌndeɪ naɪt" },
            { id: 53, chapter: "Story1", start: 211.0, end: 216.0, en: "to get one good meal a week at the Hare Krishna temple.", ja: "ハレ・クリシュナ寺院で週に一度のまともな食事にありつきました。", ipa: "tə gɛt wʌn gʊd mil ə wik æt ðə ˈhɑri ˈkrɪʃnə ˈtɛmpəl." },
            { id: 54, chapter: "Story1", start: 216.0, end: 218.5, en: "I loved it.", ja: "でも私はそれを愛していました。", ipa: "aɪ lʌvd ɪt." },
            { id: 55, chapter: "Story1", start: 218.5, end: 224.0, en: "And much of what I stumbled into by following my curiosity and intuition", ja: "好奇心と直感に従って偶然出くわしたものの多くが、", ipa: "ænd mʌʧ əv wʌt aɪ ˈstʌmbəld ˈɪntu baɪ ˈfɑloʊɪŋ maɪ ˌkjʊriˈɑsəti ænd ˌɪntuˈɪʃən" },
            { id: 56, chapter: "Story1", start: 224.0, end: 228.0, en: "turned out to be priceless later on.", ja: "後になってかけがえのない価値を持つことになりました。", ipa: "tɜrnd aʊt tə bi ˈpraɪsləs ˈleɪtər ɑn." },
            { id: 57, chapter: "Story1", start: 228.0, end: 231.0, en: "Let me give you one example.", ja: "一つ例を挙げましょう。", ipa: "lɛt mi gɪv ju wʌn ɪgˈzæmpəl." },
            { id: 58, chapter: "Story1", start: 231.0, end: 237.0, en: "Reed College at that time offered perhaps the best calligraphy instruction in the country.", ja: "当時のリード大学は、おそらく全米で最高のカリグラフィの講義を提供していました。", ipa: "rid ˈkɑlɪʤ æt ðæt taɪm ˈɔfərd pərˈhæps ðə bɛst kəˈlɪgrəfi ɪnˈstrʌkʃən ɪn ðə ˈkʌntri." },
            { id: 59, chapter: "Story1", start: 237.0, end: 241.0, en: "Throughout the campus every poster,", ja: "キャンパス中のすべてのポスター、", ipa: "θruˈaʊt ðə ˈkæmpəs ˈɛvri ˈpoʊstər," },
            { id: 60, chapter: "Story1", start: 241.0, end: 246.0, en: "every label on every drawer, was beautifully hand calligraphed.", ja: "すべての引き出しのラベルが美しい手書きの文字で彩られていました。", ipa: "ˈɛvri ˈleɪbəl ɑn ˈɛvri drɔr, wʌz ˈbjutəfəli hænd kəˈlɪgræft." },
            { id: 61, chapter: "Story1", start: 246.0, end: 251.0, en: "Because I had dropped out and didn't have to take the normal classes,", ja: "私は中退して通常の授業を受ける必要がなかったので、", ipa: "bɪˈkɔz aɪ hæd drɑpt aʊt ænd ˈdɪdənt hæv tə teɪk ðə ˈnɔrməl ˈklæsəz," },
            { id: 62, chapter: "Story1", start: 251.0, end: 255.0, en: "I decided to take a calligraphy class to learn how to do this.", ja: "これを学ぶためにカリグラフィの授業を取りました。", ipa: "aɪ dɪˈsaɪdəd tə teɪk ə kəˈlɪgrəfi klæs tə lɜrn haʊ tə du ðɪs." },
            { id: 63, chapter: "Story1", start: 255.0, end: 259.0, en: "I learned about serif and sans-serif typefaces,", ja: "セリフ体やサンセリフ体について学び、", ipa: "aɪ lɜrnd əˈbaʊt ˈsɛrɪf ænd sænz-ˈsɛrɪf ˈtaɪpˌfeɪsəz," },
            { id: 64, chapter: "Story1", start: 259.0, end: 263.0, en: "about varying the amount of space between different letter combinations,", ja: "異なる文字の組み合わせによるスペース調整や、", ipa: "əˈbaʊt ˈvɛriɪŋ ðə əˈmaʊnt əv speɪs bɪˈtwin ˈdɪfərənt ˈlɛtər ˌkɑmbəˈneɪʃənz," },
            { id: 65, chapter: "Story1", start: 263.0, end: 267.0, en: "about what makes great typography great.", ja: "何が素晴らしいタイポグラフィを作るのかを学びました。", ipa: "əˈbaʊt wʌt meɪks greɪt taɪˈpɑgrəfi greɪt." },
            { id: 66, chapter: "Story1", start: 267.0, end: 272.0, en: "It was beautiful, historical, artistically subtle in a way that science can't capture,", ja: "それは科学では捉えきれないほど美しく、歴史的で、芸術的に繊細で、", ipa: "ɪt wʌz ˈbjutəfəl, hɪˈstɔrɪkəl, ɑrˈtɪstɪkəli ˈsʌtəl ɪn ə weɪ ðæt ˈsaɪəns kænt ˈkæpʧər," },
            { id: 67, chapter: "Story1", start: 272.0, end: 275.0, en: "and I found it fascinating.", ja: "私はそれに魅了されました。", ipa: "ænd aɪ faʊnd ɪt ˈfæsəˌneɪtɪŋ." },
            { id: 68, chapter: "Story1", start: 275.0, end: 280.0, en: "None of this had even a hope of any practical application in my life.", ja: "このうちの何一つとして私の人生で実用化される見込みはありませんでした。", ipa: "nʌn əv ðɪs hæd ˈivɪn ə hoʊp əv ˈɛni ˈpræktɪkəl ˌæpləˈkeɪʃən ɪn maɪ laɪf." },
            { id: 69, chapter: "Story1", start: 280.0, end: 284.5, en: "But 10 years later, when we were designing the first Macintosh computer,", ja: "しかし10年後、最初のMacintoshを設計していた時、", ipa: "bʌt 10 jɪrz ˈleɪtər, wɛn wi wɜr dɪˈzaɪnɪŋ ðə fɜrst ˈmækɪnˌtɑʃ kəmˈpjutər," },
            { id: 70, chapter: "Story1", start: 284.5, end: 288.0, en: "it all came back to me. And we designed it all into the Mac.", ja: "そのすべてが蘇ってきたのです。アンド私たちはそれをすべてMacに組み込みました。", ipa: "ɪt ɔl keɪm bæk tə mi. ænd wi dɪˈzaɪnd ɪt ɔl ˈɪntu ðə mæk." },
            { id: 71, chapter: "Story1", start: 288.0, end: 292.0, en: "It was the first computer with beautiful typography.", ja: "それは美しいタイポグラフィを備えた史上初のコンピュータでした。", ipa: "ɪt wʌz ðə fɜrst kəmˈpjutər wɪθ ˈbjutəfəl taɪˈpɑgrəfi." },
            { id: 72, chapter: "Story1", start: 292.0, end: 296.0, en: "If I had never dropped in on that single course in college,", ja: "もし私が大学であの一つの講義に潜り込んでいなければ、", ipa: "ɪf aɪ hæd ˈnɛvər drɑpt ɪn ɑn ðæt ˈsɪŋgəl kɔrs ɪn ˈkɑlɪʤ," },
            { id: 73, chapter: "Story1", start: 296.0, end: 301.0, en: "the Mac would have never had multiple typefaces or proportionally spaced fonts.", ja: "Macが複数の書体やプロポーショナルフォントを持つことは決してなかったでしょう。", ipa: "ðə mæk wʊd hæv ˈnɛvər hæd ˈmʌltəpəl ˈtaɪpˌfeɪsəz ɔr prəˈpɔrʃənəli speɪst fɑnts." },
            { id: 74, chapter: "Story1", start: 301.0, end: 304.0, en: "And since Windows just copied the Mac,", ja: "アンドWindowsはMacを模倣しただけなので、", ipa: "ænd sɪns ˈwɪndoʊz ʤʌst ˈkɑpid ðə mæk," },
            { id: 75, chapter: "Story1", start: 304.0, end: 308.0, en: "it's likely that no personal computer would have them.", ja: "パソコン全体がそれらを持たなかった可能性すらあります。", ipa: "ɪts ˈlaɪkli ðæt noʊ ˈpɜrsɪnɪl kəmˈpjutər wʊd hæv ðɛm." },
            { id: 76, chapter: "Story1", start: 308.0, end: 311.0, en: "If I had never dropped out,", ja: "もし私が中退していなければ、", ipa: "ɪf aɪ hæd ˈnɛvər drɑpt aʊt," },
            { id: 77, chapter: "Story1", start: 311.0, end: 314.0, en: "I would have never dropped in on that calligraphy class,", ja: "あのカリグラフィの授業に潜り込むこともなく、", ipa: "aɪ wʊd hæv ˈnɛvər drɑpt ɪn ɑn ðæt kəˈlɪgrəfi klæs," },
            { id: 78, chapter: "Story1", start: 314.0, end: 319.0, en: "and personal computers might not have the wonderful typography that they do.", ja: "パソコンにこれほど素晴らしいタイポグラフィが載ることもなかったでしょう。", ipa: "ænd ˈpɜrsɪnɪl kəmˈpjutərz maɪt nɑt hæv ðə ˈwʌndərfəl taɪˈpɑgrəfi ðæt ðeɪ du." },
            { id: 79, chapter: "Story1", start: 319.0, end: 324.0, en: "Of course it was impossible to connect the dots looking forward when I was in college.", ja: "もちろん、大学当時に将来を見据えて点をつなぐことなど不可能でした。", ipa: "ʌv kɔrs ɪt wʌz ɪmˈpɑsəbəl tə kəˈnɛkt ðə dɑts ˈlʊkɪŋ ˈfɔrwərd wɛn aɪ wʌz ɪn ˈkɑlɪʤ." },
            { id: 80, chapter: "Story1", start: 324.0, end: 328.0, en: "But it was very, very clear looking backwards ten years later.", ja: "しかし10年後に振り返った時、それは非常に明確だったのです。", ipa: "bʌt ɪt wʌz ˈvɛri, ˈvɛri klɪr ˈlʊkɪŋ ˈbækwərdz tɛn jɪrz ˈleɪtər." },
            { id: 81, chapter: "Story1", start: 328.0, end: 331.0, en: "Again, you can't connect the dots looking forward;", ja: "繰り返しになりますが、先を見通して点をつなぐことはできません；", ipa: "əˈgɛn, ju kænt kəˈnɛkt ðə dɑts ˈlʊkɪŋ ˈfɔrwərd;" },
            { id: 82, chapter: "Story1", start: 331.0, end: 334.0, en: "you can only connect them looking backwards.", ja: "過去を振り返ることでしか点をつなぐことはできないのです。", ipa: "ju kæn ˈoʊnli kəˈnɛkt ðɛm ˈlʊkɪŋ ˈbækwərdz." },
            { id: 83, chapter: "Story1", start: 334.0, end: 338.0, en: "So you have to trust that the dots will somehow connect in your future.", ja: "だからこそ、将来どこかで点と点がつながると信じなければなりません。", ipa: "soʊ ju hæv tə trʌst ðæt ðə dɑts wɪl ˈsʌmˌhaʊ kəˈnɛkt ɪn jʊər ˈfjuʧər." },
            { id: 84, chapter: "Story1", start: 338.0, end: 341.0, en: "You have to trust in something —", ja: "何かを信じる必要があります——", ipa: "ju hæv tə trʌst ɪn ˈsʌmθɪŋ —" },
            { id: 85, chapter: "Story1", start: 341.0, end: 345.0, en: "your gut, destiny, life, karma, whatever.", ja: "直感、運命、人生、カルマ、何でもいいのです。", ipa: "jʊər gʌt, ˈdɛstəni, laɪf, ˈkɑrmə, ˌwʌˈtɛvər." },
            { id: 86, chapter: "Story1", start: 345.0, end: 348.5, en: "Because believing that the dots will connect down the road", ja: "点がいずれつながると信じることで、", ipa: "bɪˈkɔz bɪˈlivɪŋ ðæt ðə dɑts wɪl kəˈnɛkt daʊn ðə roʊd" },
            { id: 87, chapter: "Story1", start: 348.5, end: 352.0, en: "will give you the confidence to follow your heart", ja: "自分の心に従う自信が生まれます、", ipa: "wɪl gɪv ju ðə ˈkɑnfədəns tə ˈfɑloʊ jʊər hɑrt" },
            { id: 88, chapter: "Story1", start: 352.0, end: 356.0, en: "even when it leads you off the well-worn path.", ja: "たとえそれが道なき道へと導くことになろうとも。", ipa: "ˈivɪn wɛn ɪt lidz ju ɔf ðə wɛl-wɔrn pæθ." },
            { id: 89, chapter: "Story1", start: 356.0, end: 360.0, en: "And that will make all the difference.", ja: "それがすべての違いを生むのです。", ipa: "ænd ðæt wɪl meɪk ɔl ðə ˈdɪfərəns." },

            { id: 90, chapter: "Story2", start: 360.0, end: 364.0, en: "My second story is about love and loss.", ja: "2つ目の物語は、愛と挫折についてです。", ipa: "maɪ ˈsɛkənd ˈstɔri ɪz əˈbaʊt lʌv ænd lɔs." },
            { id: 91, chapter: "Story2", start: 364.0, end: 368.0, en: "I was lucky — I found what I loved to do early in life.", ja: "私は幸運でした。人生の早い段階で、自分が愛せることを見つけられたからです。", ipa: "aɪ wʌz ˈlʌki — aɪ faʊnd wʌt aɪ lʌvd tə du ˈɜrli ɪn laɪf." },
            { id: 92, chapter: "Story2", start: 368.0, end: 372.5, en: "Woz and I started Apple in my parents' garage when I was 20.", ja: "20歳の時、ウォズと私は実家のガレージでAppleを創業しました。", ipa: "wɑz ænd aɪ ˈstɑrtəd ˈæpəl ɪn maɪ ˈpɛrənts gəˈrɑʒ wɛn aɪ wʌz 20." },
            { id: 93, chapter: "Story2", start: 372.5, end: 377.0, en: "We worked hard, and in 10 years Apple had grown from just the two of us in a garage", ja: "がむしゃらに働き、10年でAppleはガレージのたった2人から", ipa: "wi wɜrkt hɑrd, ænd ɪn 10 jɪrz ˈæpəl hæd groʊn frəm ʤʌst ðə tu əv ʌs ɪn ə gəˈrɑʒ" },
            { id: 94, chapter: "Story2", start: 377.0, end: 381.0, en: "into a $2 billion company with over 4,000 employees.", ja: "4000人以上を抱える20億ドル規模の企業に成長しました。", ipa: "ˈɪntu ə 2 ˈbɪljən ˈdɑlər ˈkʌmpəni wɪθ ˈoʊvər 4,000 ɪmˈplɔɪiz." },
            { id: 95, chapter: "Story2", start: 381.0, end: 385.0, en: "We'd just released our finest creation — the Macintosh — a year earlier,", ja: "最高傑作のMacintoshを発売した翌年、", ipa: "wid ʤʌst rɪˈlist ɑr ˈfaɪnəst kriˈeɪʃən — ðə ˈmækɪnˌtɑʃ — ə jɪr ˈɜrliər," },
            { id: 96, chapter: "Story2", start: 385.0, end: 388.5, en: "and I had just turned 30. And then I got fired.", ja: "私は30歳になったばかりでした。そして私は会社を解雇されたのです。", ipa: "ænd aɪ hæd ʤʌst tɜrnd 30. ænd ðɛn aɪ gɑt ˈfaɪərd." },
            { id: 97, chapter: "Story2", start: 388.5, end: 392.0, en: "How can you get fired from a company you started?", ja: "自分が作った会社からどうやってクビになるのでしょうか？", ipa: "haʊ kæn ju gɛt ˈfaɪərd frəm ə ˈkʌmpəni ju ˈstɑrtəd?" },
            { id: 98, chapter: "Story2", start: 392.0, end: 396.0, en: "Well, as Apple grew we hired someone who I thought was very talented", ja: "会社が大きくなるにつれ、優秀だと思う人物を雇いました、", ipa: "wɛl, æz ˈæpəl gru wi ˈhaɪərd ˈsʌmˌwʌn hu aɪ θɔt wʌz ˈvɛri ˈtæləntəd" },
            { id: 99, chapter: "Story2", start: 396.0, end: 400.0, en: "to run the company with me, and for the first year or so things went well.", ja: "私と一緒に経営を行うために。最初の1年はうまくいっていました。", ipa: "tə rʌn ðə ˈkʌmpəni wɪθ mi, ænd fər ðə fɜrst jɪr ɔr soʊ θɪŋz wɛnt wɛl." },
            { id: 100, chapter: "Story2", start: 400.0, end: 404.0, en: "But then our visions of the future began to diverge", ja: "しかし将来のビジョンが分岐し始め、", ipa: "bʌt ðɛn ɑr ˈvɪʒənz əv ðə ˈfjuʧər bɪˈgæn tə daɪˈvɜrʤ" },
            { id: 101, chapter: "Story2", start: 404.0, end: 407.0, en: "and eventually we had a falling out.", ja: "最終的に袂を分かちました。", ipa: "ænd ɪˈvɛnʧuəli wi hæd ə ˈfɑlɪŋ aʊt." },
            { id: 102, chapter: "Story2", start: 407.0, end: 410.5, en: "When we did, our Board of Directors sided with him.", ja: "その際、取締役会は彼の側につきました。", ipa: "wɛn wi dɪd, ɑr bɔrd əv dɪˈrɛktərz ˈsaɪdəd wɪθ hɪm." },
            { id: 103, chapter: "Story2", start: 410.5, end: 415.0, en: "And so at 30 I was out. And very publicly out.", ja: "こうして30歳で、私は公の場で追放されました。", ipa: "ænd soʊ æt 30 aɪ wʌz aʊt. ænd ˈvɛri ˈpʌblɪkli aʊt." },
            { id: 104, chapter: "Story2", start: 415.0, end: 420.0, en: "What had been the focus of my entire adult life was gone,", ja: "私の成人人生のすべての中心だったものが消え去り、", ipa: "wʌt hæd bɪn ðə ˈfoʊkəs əv maɪ ɪnˈtaɪər əˈdʌlt laɪf wʌz gɔn," },
            { id: 105, chapter: "Story2", start: 420.0, end: 423.5, en: "and it was devastating.", ja: "壊滅的でした。", ipa: "ænd ɪt wʌz ˈdɛvəˌsteɪtɪŋ." },
            { id: 106, chapter: "Story2", start: 423.5, end: 427.0, en: "I really didn't know what to do for a few months.", ja: "数ヶ月間どうしていいか分かりませんでした。", ipa: "aɪ ˈrɪli ˈdɪdənt noʊ wʌt tə du fər ə fju mʌnθs." },
            { id: 107, chapter: "Story2", start: 427.0, end: 431.0, en: "I felt that I had let the previous generation of entrepreneurs down —", ja: "先輩世代の起業家たちを失望させたと感じていました——", ipa: "aɪ fɛlt ðæt aɪ hæd lɛt ðə ˈpriviəs ˌʤɛnəˈreɪʃən əv ˌɑntrəprəˈnɜrz daʊn —" },
            { id: 108, chapter: "Story2", start: 431.0, end: 435.0, en: "that I had dropped the baton as it was being passed to me.", ja: "引き継がれたバトンを落としてしまったのだと。", ipa: "ðæt aɪ hæd drɑpt ðə bəˈtɑn æz ɪt wʌz ˈbiɪŋ pæst tə mi." },
            { id: 109, chapter: "Story2", start: 435.0, end: 438.5, en: "I met with David Packard and Bob Noyce", ja: "私はデイヴィッド・パッカードやボブ・ノイスに会い、", ipa: "aɪ mɛt wɪθ ˈdeɪvɪd ˈpækərd ænd bɑb nɔɪs" },
            { id: 110, chapter: "Story2", start: 438.5, end: 442.0, en: "and tried to apologize for screwing up so badly.", ja: "無様に台無しにしたことを謝罪しようとしました。", ipa: "ænd traɪd tu əˈpɑləˌʤaɪz fər ˈskruɪŋ ʌp soʊ ˈbædli." },
            { id: 111, chapter: "Story2", start: 442.0, end: 445.0, en: "I was a very public failure,", ja: "私の失敗は有名で、", ipa: "aɪ wʌz ə ˈvɛri ˈpʌblɪk ˈfeɪljər," },
            { id: 112, chapter: "Story2", start: 445.0, end: 449.0, en: "and I even thought about running away from the valley.", ja: "シリコンバレーから逃げ出そうとも考えました。", ipa: "ænd aɪ ˈivɪn θɔt əˈbaʊt ˈrʌnɪŋ əˈweɪ frəm ðə ˈvæli." },
            { id: 113, chapter: "Story2", start: 449.0, end: 453.0, en: "But something slowly began to dawn on me —", ja: "しかし、あることが少しずつ頭に浮かび上がってきました——", ipa: "bʌt ˈsʌmθɪŋ ˈsloʊli bɪˈgæn tə dɔn ɑn mi —" },
            { id: 114, chapter: "Story2", start: 453.0, end: 456.0, en: "I still loved what I did.", ja: "自分はまだ、自分のやっていたことが好きなのだと。", ipa: "aɪ stɪl lʌvd wʌt aɪ dɪd." },
            { id: 115, chapter: "Story2", start: 456.0, end: 460.0, en: "The turn of events at Apple had not changed that one bit.", ja: "Appleでの失脚という事態も、その気持ちを1ミリも変えませんでした。", ipa: "ðə tɜrn əv ɪˈvɛnts æt ˈæpəl hæd nɑt ʧeɪnʤd ðæt wʌn bɪt." },
            { id: 116, chapter: "Story2", start: 460.0, end: 463.5, en: "I had been rejected, but I was still in love.", ja: "拒絶されても、私はまだ愛していたのです。", ipa: "aɪ hæd bɪn rɪˈʤɛktəd, bʌt aɪ wʌz stɪl ɪn lʌv." },
            { id: 117, chapter: "Story2", start: 463.5, end: 467.0, en: "And so I decided to start over.", ja: "だから、もう一度やり直す決意をしました。", ipa: "ænd soʊ aɪ dɪˈsaɪdəd tə stɑrt ˈoʊvər." },
            { id: 118, chapter: "Story3", start: 837.0, end: 854.0, en: "Stay Hungry. Stay Foolish. Thank you all very much.", ja: "ハングリーであれ。愚かであれ。ご清聴ありがとうございました。", ipa: "steɪ ˈhʌŋgri. steɪ ˈfulɪʃ. θæŋk ju ɔl ˈvɛri mʌʧ." }
        ];

        let currentIndex = 0;
        let isLooping = false;
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');

        function renderAllSentences() {
            const container = document.getElementById('sentenceContainer');
            container.innerHTML = '';
            
            let currentChap = "";
            SPEECH_DATA.forEach((item) => {
                if (item.chapter !== currentChap) {
                    currentChap = item.chapter;
                    const header = document.createElement('div');
                    header.className = 'chapter-title';
                    header.id = `chap-header-${currentChap}`;
                    header.textContent = currentChap === 'Intro' ? 'Introduction' : 
                                         currentChap === 'Story1' ? '1. Connecting the Dots' :
                                         currentChap === 'Story2' ? '2. Love and Loss' : '3. Death';
                    container.appendChild(header);
                }

                const card = document.createElement('div');
                card.className = 'sentence-card';
                card.id = `card-${item.id}`;
                card.onclick = () => playSentence(item.id);
                card.innerHTML = `
                    <div class="en">${item.en}</div>
                    <div class="ja">${item.ja}</div>
                    <div class="ipa">${item.ipa}</div>
                `;
                container.appendChild(card);
            });
        }

        function playSentence(id) {
            currentIndex = SPEECH_DATA.findIndex(s => s.id === id);
            const item = SPEECH_DATA[currentIndex];
            audio.currentTime = item.start;
            audio.play();
            updatePlayButton(true);
            updateActiveCard(true); // 即時スクロール指示
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                updatePlayButton(true);
            } else {
                audio.pause();
                updatePlayButton(false);
            }
        }

        function updatePlayButton(isPlaying) {
            if(isPlaying) {
                playBtn.innerHTML = '⏸ 一時停止';
                playBtn.classList.add('playing');
            } else {
                playBtn.innerHTML = '▶ 再生';
                playBtn.classList.remove('playing');
            }
        }

        function prevSentence() {
            if (currentIndex > 0) {
                currentIndex--;
                playSentence(SPEECH_DATA[currentIndex].id);
            } else {
                audio.currentTime = SPEECH_DATA[currentIndex].start;
            }
        }

        function nextSentence() {
            if (currentIndex < SPEECH_DATA.length - 1) {
                currentIndex++;
                playSentence(SPEECH_DATA[currentIndex].id);
            }
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            if (isLooping) {
                btn.innerHTML = '🔁 1文ループ: ON';
                btn.classList.add('loop-on');
            } else {
                btn.innerHTML = '🔁 1文ループ: OFF';
                btn.classList.remove('loop-on');
            }
        }

        function changeSpeed() {
            const speed = document.getElementById('speedSelect').value;
            audio.playbackRate = parseFloat(speed);
        }

        function scrollToChapter(chapter) {
            const firstOfChapter = SPEECH_DATA.find(s => s.chapter === chapter);
            if (firstOfChapter) {
                playSentence(firstOfChapter.id);
            }
        }

        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.body.className = `mode-${mode}`;
        }

        // 判定・ハイライトおよび絶対座標によるラグなし物理スクロール処理
        function updateActiveCard(forceImmediate = false) {
            document.querySelectorAll('.sentence-card').forEach(c => c.classList.remove('active'));
            const currentItem = SPEECH_DATA[currentIndex];
            if(!currentItem) return;
            
            const card = document.getElementById(`card-${currentItem.id}`);
            if (card) {
                card.classList.add('active');
                
                // 文頭のタイミングで即座に画面中央へ吸い付ける計算
                const rect = card.getBoundingClientRect();
                const cardCenter = rect.top + rect.height / 2;
                const windowCenter = window.innerHeight / 2;
                const offset = cardCenter - windowCenter;

                window.scrollBy({
                    top: offset,
                    behavior: forceImmediate ? 'auto' : 'smooth'
                });
            }

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeTab = document.getElementById(`tab-${currentItem.chapter}`);
            if (activeTab) activeTab.classList.add('active');
        }

        // 超高速60fps（16ms精度）リアルタイム時間監視Loop機能
        function syncLoop() {
            if (!audio.paused) {
                const time = audio.currentTime;
                const foundIndex = SPEECH_DATA.findIndex(s => time >= s.start && time < s.end);
                
                // 音声が新しいフレーズの文頭（start）に入った瞬間に検知
                if (foundIndex !== -1 && foundIndex !== currentIndex) {
                    currentIndex = foundIndex;
                    updateActiveCard(); // 瞬時に自動スクロール起動
                }

                const currentItem = SPEECH_DATA[currentIndex];
                if (currentItem && time >= currentItem.end) {
                    if (isLooping) {
                        audio.currentTime = currentItem.start;
                    }
                }
            }
            requestAnimationFrame(syncLoop);
        }

        window.onload = () => {
            renderAllSentences();
            updateActiveCard(true);
            requestAnimationFrame(syncLoop); // 秒間60回の超高速同期ループを開始
        };
    </script>
</body>
</html>
